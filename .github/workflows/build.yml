name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # compile + test + JaCoCo report + coverage gate (90% line / 85% branch)
      - name: Build, test and check coverage
        run: mvn -B clean verify

      - name: Upload JaCoCo HTML report (downloadable artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      # Package the JaCoCo report for GitHub Pages (default branch only, and only if a report exists)
      - name: Package report for GitHub Pages
        id: pages
        if: >-
          always() && github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch &&
          hashFiles('target/site/jacoco/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/jacoco

  deploy:
    needs: test
    if: always() && needs.test.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
